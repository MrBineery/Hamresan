[package]
name = "hamresan"
version = "0.1.0"
edition = "2021"
description = "Local network file sharing. Open on any browser. No app needed."
build = "build.rs"

[dependencies]
axum             = { version = "0.7", features = ["multipart"] }
tokio            = { version = "1.40", features = ["full"] }
tokio-util       = { version = "0.7", features = ["io"] }
tower-http       = { version = "0.6", features = ["trace"] }
futures-util     = "0.3"
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
anyhow           = "1.0"
clap             = { version = "4.5", features = ["derive"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
local-ip-address = "0.6"
mime_guess       = "2.0"
urlencoding      = "2.1"
dirs             = "5.0"
open             = "5.3"
qrcode           = { version = "0.14", features = ["svg"] }
wry              = "0.48"
tao              = "0.30"
tray-icon        = "0.19"
rand             = "0.8"
sha2             = "0.10"
hex              = "0.4"
image            = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
winres           = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"